name: CD

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OML_PLATFORM_API_KEY: ${{ secrets.OML_PLATFORM_API_KEY }}
    defaults:
      run:
        working-directory: my-project
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install OML
        run: npm install -g @oml/cli

      - name: Version OML
        run: oml -v

      - name: Check authentication
        run: oml whoami

      - name: Starting server
        run: oml start

      - name: Rendering
        run: oml render

      - name: Stopping server
        if: always()
        run: oml stop

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-project/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
